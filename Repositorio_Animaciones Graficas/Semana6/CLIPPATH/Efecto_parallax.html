<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parallax Anime</title>

<style>

*{
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
}

/* ESCENA */

.escena{

    width:100%;
    height:100vh;

    position:relative;
    overflow:hidden;
}

/* ========================= */
/* CIELO */
/* ========================= */

.cielo{

    width:120%;
    height:120%;

    position:absolute;

    background-image:url(img/cielo.jpg);
    background-size:cover;
    background-position:center;

    animation:moverCielo 20s infinite alternate ease-in-out;
}

/* ========================= */
/* SOL */
/* ========================= */

.sol{

    width:180px;
    height:180px;

    border-radius:50%;

    position:absolute;

    top:60px;
    right:120px;

    background-image:url(img/sol.jpg);
    background-size:cover;
    background-position:center;

    opacity:0.9;

    animation:moverSol 8s infinite alternate ease-in-out;
}

/* ========================= */
/* PERSONA */
/* ========================= */

.persona{

    width:250px;
    height:450px;

    position:absolute;

    bottom:120px;
    left:38%;

    background-image:url(img/persona1.jpg);
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;

    z-index:2;

    animation:moverPersona 4s infinite alternate ease-in-out;
}

/* ========================= */
/* CESPED */
/* ========================= */

.cesped{

    width:130%;
    height:350px;

    position:absolute;

    bottom:-20px;
    left:-50px;

    background-image:url(img/cesped.jpg);
    background-size:cover;
    background-position:center;

    z-index:3;

    animation:moverCesped 5s infinite alternate ease-in-out;
}

/* ========================= */
/* ANIMACIONES */
/* ========================= */

@keyframes moverCielo{

    0%{
        transform:scale(1) translateX(0px);
    }

    100%{
        transform:scale(1.1) translateX(-20px);
    }
}

@keyframes moverSol{

    0%{
        transform:translateY(0px) scale(1);
    }

    100%{
        transform:translateY(10px) scale(1.1);
    }
}

@keyframes moverPersona{

    0%{
        transform:translateY(0px);
    }

    100%{
        transform:translateY(-15px);
    }
}

@keyframes moverCesped{

    0%{
        transform:translateX(0px) scale(1);
    }

    100%{
        transform:translateX(-80px) scale(1.05);
    }
}

</style>

</head>
<body>

<div class="escena">

    <div class="cielo"></div>

    <div class="sol"></div>

    <div class="persona"></div>

    <div class="cesped"></div>

</div>

</body>
</html>
